name: hello-service-secure-ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "hello-service/**"
      - ".github/workflows/hello-service-ci.yml"
  push:
    branches: [main]
    paths:
      - "hello-service/**"
      - ".github/workflows/hello-service-ci.yml"

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

env:
  APP_DIR: hello-service
  REGISTRY: ghcr.io
  IMAGE_NAME: kuddusic/hello-service

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hello-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: hello-service/pom.xml

      - name: Run unit tests
        run: mvn -B test

      - name: Package application
        run: mvn -B clean package -DskipTests

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      - name: Build for CodeQL
        run: mvn -B compile -DskipTests

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY -u ${{ github.actor }} --password-stdin

      - name: Build container image
        run: |
          docker build \
            -f Dockerfile \
            -t $REGISTRY/$IMAGE_NAME:${{ github.sha }} \
            -t $REGISTRY/$IMAGE_NAME:latest \
            .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker push $REGISTRY/$IMAGE_NAME:${{ github.sha }}
          docker push $REGISTRY/$IMAGE_NAME:latest

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        if: github.event_name != 'pull_request'
        run: cosign sign --yes $REGISTRY/$IMAGE_NAME:${{ github.sha }}
